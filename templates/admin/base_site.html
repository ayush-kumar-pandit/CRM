{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}InvoStock Administration{% endblock %}

{% block branding %}
<div id="site-name" style="display: flex; align-items: center; gap: 10px;">
  <a href="{% url 'admin:index' %}" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
    <img src="{% static 'images/invostock-icon.svg' %}" alt="InvoStock" style="height: 28px; width: 28px; border-radius: 6px;" />
    <span style="font-weight: 700; font-size: 18px; color: var(--header-link-color, #ffffff); letter-spacing: -0.3px;">
      Invo<span style="color: #818cf8;">Stock</span>
    </span>
    <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; margin-left: 2px;">Admin</span>
  </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
